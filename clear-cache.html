<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nettoyage École Joyeuse</title>
<style>
  body { font-family: system-ui; background: #007A5E; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; padding: 2rem; box-sizing: border-box; }
  .card { background: rgba(255,255,255,0.15); border-radius: 20px; padding: 2rem; max-width: 380px; }
  h1 { font-size: 1.4em; margin-bottom: 1rem; }
  p { opacity: 0.9; margin-bottom: 1.5rem; font-size: 0.95em; line-height: 1.6; }
  .status { font-size: 1.1em; font-weight: 700; margin: 1rem 0; min-height: 2em; }
  .btn { display: inline-block; background: #FCD116; color: #000; font-weight: 700; padding: 1rem 2rem; border-radius: 50px; text-decoration: none; font-size: 1.1em; margin-top: 1rem; cursor: pointer; border: none; width: 100%; }
  .btn:disabled { opacity: 0.5; }
  .step { font-size: 0.85em; opacity: 0.7; margin-top: 0.5rem; }
</style>
</head>
<body>
<div class="card">
  <h1>🔧 Nettoyage automatique</h1>
  <p>Cette page supprime les anciens fichiers en cache et recharge l'application proprement.</p>
  <div class="status" id="status">⏳ Nettoyage en cours…</div>
  <div class="step" id="step"></div>
  <a href="/app" class="btn" id="btn" style="display:none">🚀 Ouvrir l'app</a>
</div>

<script>
async function purge() {
  const status = document.getElementById('status');
  const step = document.getElementById('step');
  const btn = document.getElementById('btn');
  let done = 0;

  try {
    step.textContent = 'Étape 1/3 : désinstallation des anciens Service Workers…';
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
      done++;
    }

    step.textContent = 'Étape 2/3 : suppression des caches…';
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
      done++;
    }

    step.textContent = 'Étape 3/3 : nettoyage terminé ✓';
    done++;

    status.textContent = '✅ Nettoyage réussi !';
    btn.style.display = 'inline-block';

    // Redirection automatique dans 2 secondes
    setTimeout(() => { window.location.href = '/app'; }, 2000);
    step.textContent = 'Redirection automatique dans 2 secondes…';

  } catch(e) {
    status.textContent = '⚠️ Erreur partielle — ' + done + '/3 étapes';
    btn.style.display = 'inline-block';
    step.textContent = e.message;
  }
}

purge();
</script>
</body>
</html>
